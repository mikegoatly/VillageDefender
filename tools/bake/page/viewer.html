<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sprite viewer</title>
    <style>
      body { margin: 0; padding: 8px; background: #d9bfa6; font: 12px sans-serif; color: #333; }
      .row { display: flex; gap: 2px; align-items: flex-end; margin-bottom: 4px; }
      .row b { width: 70px; }
      canvas { background: #c9ab8f; }
    </style>
  </head>
  <body>
    <!-- Usage: viewer.html?sheet=knight&anim=walk&scale=1 -->
    <div id="out"></div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const name = q.get('sheet') ?? 'knight';
      const scale = +(q.get('scale') ?? 1);
      const meta = await (await fetch(`/public/assets/sprites/${name}.json`)).json();
      const img = new Image();
      img.src = `/public/assets/sprites/${meta.image}?t=${Date.now()}`;
      await img.decode();
      const out = document.getElementById('out');
      const atlas = await (await fetch(`/public/assets/sprites/${meta.atlas}`)).json();
      const drawFrame = (parent, frameName) => {
        const c = document.createElement('canvas');
        c.width = meta.frameWidth * scale; c.height = meta.frameHeight * scale;
        const ctx = c.getContext('2d');
        const f = atlas.frames[frameName];
        ctx.drawImage(img, f.frame.x, f.frame.y, f.frame.w, f.frame.h,
          f.spriteSourceSize.x * scale, f.spriteSourceSize.y * scale, f.spriteSourceSize.w * scale, f.spriteSourceSize.h * scale);
        ctx.fillStyle = 'red'; ctx.fillRect(meta.pivotX * scale - 2, meta.pivotY * scale - 2, 4, 4);
        parent.appendChild(c);
      };
      if (meta.anims) {
        const anims = q.get('anim') ? [q.get('anim')] : Object.keys(meta.anims);
        for (const a of anims) {
          for (const d of meta.directions) {
            const row = document.createElement('div'); row.className = 'row';
            row.innerHTML = `<b>${a} ${d}</b>`;
            const info = meta.anims[a];
            for (let i = 0; i < info.frames; i++) drawFrame(row, `${a}/${d}/${i}`);
            out.appendChild(row);
          }
        }
      } else {
        const row = document.createElement('div'); row.className = 'row';
        for (let i = 0; i < meta.frameCount; i++) drawFrame(row, `view/${i}`);
        out.appendChild(row);
      }
      window.viewerReady = true;
    </script>
  </body>
</html>
